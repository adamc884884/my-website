<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Adam Cox</title>
<meta name="color-scheme" content="light dark">
<style>
  :root {
    --bg: #f7f6f3;
    --fg: #16151a;
    --accent: #6a5acd;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0b0b0d;
      --fg: #f2f1ee;
      --accent: #a99bff;
    }
  }

  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  html, body {
    height: 100%;
  }

  body {
    background: var(--bg);
    color: var(--fg);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    overflow: hidden;
    position: relative;
  }

  .glow {
    position: absolute;
    inset: 0;
    background: radial-gradient(circle at 50% 45%, var(--accent) 0%, transparent 45%);
    opacity: 0.12;
    pointer-events: none;
  }

  h1 {
    font-size: clamp(2.5rem, 8vw, 6rem);
    font-weight: 600;
    letter-spacing: -0.03em;
    text-align: center;
    opacity: 0;
    animation: reveal 1.2s ease-out 0.15s forwards;
  }

  @keyframes reveal {
    from {
      opacity: 0;
      transform: translateY(12px);
      filter: blur(6px);
    }
    to {
      opacity: 1;
      transform: translateY(0);
      filter: blur(0);
    }
  }

  @media (prefers-reduced-motion: reduce) {
    h1 {
      animation: none;
      opacity: 1;
    }
  }
</style>
</head>
<body>
  <div class="glow"></div>
  <h1>Adam Cox</h1>
</body>
</html>
